<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>ADEl — Smart Digital Workspace</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#18233c;--line:#263653;--text:#eef3ff;--muted:#9eacc7;--blue:#6d9cff;--blue2:#376fe0;--green:#5dd6a2;--danger:#ff7b88}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1d3158 0,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));background:#0b1020e8;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:.3px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#80aaff,#376fe0);display:grid;place-items:center;color:white;font-size:25px;box-shadow:0 8px 25px #376fe055}
.topright{display:flex;gap:10px;align-items:center}.lang,.ghost{border:1px solid var(--line);color:var(--text);background:var(--panel);border-radius:10px;padding:9px 12px}
.wrap{max-width:1180px;margin:auto;padding:38px 22px 70px}.hero{padding:28px 0 30px}.eyebrow{color:var(--green);font-size:13px;font-weight:700;letter-spacing:1px}.hero h1{font-size:clamp(30px,5vw,48px);margin:12px 0 10px;line-height:1.15}.hero p{color:var(--muted);max-width:650px;line-height:1.8;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:24px}.tool{background:linear-gradient(145deg,var(--panel),#10182b);border:1px solid var(--line);border-radius:17px;padding:19px;text-align:start;color:var(--text);min-height:140px;transition:.18s}.tool:hover{transform:translateY(-3px);border-color:#608ee6;box-shadow:0 14px 35px #0003}.ico{font-size:25px}.tool h3{margin:12px 0 5px;font-size:17px}.tool p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.workspace{display:none;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.workspace.active{display:block}.workhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.workhead h2{margin:0}.back{background:transparent;color:var(--blue);border:0}
label{display:block;color:var(--muted);font-size:13px;margin:13px 0 7px}textarea,input[type=text],input[type=url],select{width:100%;background:#0b1325;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);outline:none}textarea{min-height:150px;resize:vertical;line-height:1.7}textarea:focus,input:focus,select:focus{border-color:var(--blue)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.primary,.secondary{border:0;border-radius:10px;padding:10px 15px;font-weight:650}.primary{background:linear-gradient(135deg,#6d9cff,#376fe0);color:white}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.status{color:var(--green);font-size:13px;margin-top:10px;min-height:20px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:13px}.stat b{color:var(--text);font-size:17px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.drop{border:1px dashed #49618b;border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
#qrout{background:white;display:inline-block;padding:12px;border-radius:10px;margin-top:15px;min-height:10px}
footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding-top:24px}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:0 14px}.hero{padding-top:15px}.workspace{padding:15px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">A</div><span>ADEl</span></div>
  <div class="topright"><span style="color:var(--muted);font-size:12px" id="tagline">مساحة عمل رقمية ذكية</span>
    <select class="lang" id="language" aria-label="Language"><option value="ar">العربية</option><option value="fr">Français</option><option value="en">English</option></select>
  </div>
</header>
<main class="wrap">
  <section class="hero" id="hero">
    <div class="eyebrow" id="eyebrow">مساحة عملك الرقمية</div>
    <h1 id="headline">كل أدواتك. مكان واحد.</h1>
    <p id="intro">أدوات بسيطة وسريعة تساعدك على إنجاز مهامك اليومية مباشرة من المتصفح. ملفاتك تبقى على جهازك عند استخدام الأدوات المحلية.</p>
  </section>
  <section class="grid" id="tools">
    <button class="tool" data-tool="counter"><div class="ico">🔤</div><h3 data-t="counterTitle">عداد الكلمات</h3><p data-t="counterDesc">احسب الكلمات والحروف والجمل.</p></button>
    <button class="tool" data-tool="cleaner"><div class="ico">🧹</div><h3 data-t="cleanTitle">تنظيف النصوص</h3><p data-t="cleanDesc">احذف المسافات الزائدة والأسطر الفارغة.</p></button>
    <button class="tool" data-tool="duplicates"><div class="ico">♻️</div><h3 data-t="dupTitle">حذف التكرار</h3><p data-t="dupDesc">احذف الأسطر المكررة من النص.</p></button>
    <button class="tool" data-tool="formatter"><div class="ico">✍️</div><h3 data-t="formatTitle">تنسيق النص</h3><p data-t="formatDesc">حوّل النص إلى أحرف كبيرة أو صغيرة.</p></button>
    <button class="tool" data-tool="image"><div class="ico">🖼️</div><h3 data-t="imageTitle">ضغط الصور</h3><p data-t="imageDesc">قلّل حجم صور JPG وPNG وWEBP داخل المتصفح.</p></button>
    <button class="tool" data-tool="qr"><div class="ico">▦</div><h3 data-t="qrTitle">إنشاء QR</h3><p data-t="qrDesc">حوّل رابطًا أو نصًا إلى رمز QR.</p></button>
    <button class="tool" data-tool="units"><div class="ico">📐</div><h3 data-t="unitTitle">تحويل الوحدات</h3><p data-t="unitDesc">حوّل الطول والوزن ودرجة الحرارة.</p></button>
  </section>
  <section class="workspace" id="workspace">
    <div class="workhead"><h2 id="worktitle"></h2><button class="back" id="back">← <span id="backtxt">العودة للأدوات</span></button></div>
    <div id="workbody"></div>
  </section>
</main>
<footer id="footer">ADEl © 2026 · أدوات تعمل داخل متصفحك</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const dict={
ar:{tagline:"مساحة عمل رقمية ذكية",eyebrow:"مساحة عملك الرقمية",headline:"كل أدواتك. مكان واحد.",intro:"أدوات بسيطة وسريعة تساعدك على إنجاز مهامك اليومية مباشرة من المتصفح. ملفاتك تبقى على جهازك عند استخدام الأدوات المحلية.",counterTitle:"عداد الكلمات",counterDesc:"احسب الكلمات والحروف والجمل.",cleanTitle:"تنظيف النصوص",cleanDesc:"احذف المسافات الزائدة والأسطر الفارغة.",dupTitle:"حذف التكرار",dupDesc:"احذف الأسطر المكررة من النص.",formatTitle:"تنسيق النص",formatDesc:"حوّل النص إلى أحرف كبيرة أو صغيرة.",imageTitle:"ضغط الصور",imageDesc:"قلّل حجم صور JPG وPNG وWEBP داخل المتصفح.",qrTitle:"إنشاء QR",qrDesc:"حوّل رابطًا أو نصًا إلى رمز QR.",unitTitle:"تحويل الوحدات",unitDesc:"حوّل الطول والوزن ودرجة الحرارة.",back:"العودة للأدوات",text:"النص",paste:"اكتب أو الصق النص هنا...",count:"احسب",words:"الكلمات",chars:"الأحرف",sentences:"الجمل",clean:"تنظيف النص",removeDup:"حذف الأسطر المكررة",upper:"أحرف كبيرة",lower:"أحرف صغيرة",copy:"نسخ النتيجة",copied:"تم النسخ",result:"النتيجة",file:"اختر صورة",quality:"جودة الصورة",compress:"ضغط الصورة",download:"تنزيل الصورة",qrInput:"الرابط أو النص",makeQR:"إنشاء الرمز",length:"الطول",weight:"الوزن",temperature:"الحرارة",from:"من",to:"إلى",convert:"تحويل",value:"القيمة",selectFile:"اختر صورة من جهازك",noFile:"لم تختر صورة بعد",ready:"تم بنجاح",footer:"ADEl © 2026 · أدوات تعمل داخل متصفحك",invalid:"أدخل قيمة صحيحة",qrError:"تعذر تحميل مكتبة QR. تحقق من اتصال الإنترنت."},
fr:{tagline:"Espace de travail numérique",eyebrow:"Votre espace numérique",headline:"Tous vos outils. Un seul endroit.",intro:"Des outils simples et rapides pour vos tâches quotidiennes, directement dans votre navigateur. Les fichiers restent sur votre appareil avec les outils locaux.",counterTitle:"Compteur de mots",counterDesc:"Comptez les mots, caractères et phrases.",cleanTitle:"Nettoyeur de texte",cleanDesc:"Supprimez les espaces et lignes vides.",dupTitle:"Supprimer les doublons",dupDesc:"Supprimez les lignes répétées.",formatTitle:"Formater le texte",formatDesc:"Convertissez en majuscules ou minuscules.",imageTitle:"Compresser une image",imageDesc:"Réduisez les images JPG, PNG et WEBP dans le navigateur.",qrTitle:"Générateur QR",qrDesc:"Transformez un lien ou texte en QR code.",unitTitle:"Convertisseur",unitDesc:"Convertissez longueur, poids et température.",back:"Retour aux outils",text:"Texte",paste:"Écrivez ou collez votre texte ici...",count:"Compter",words:"Mots",chars:"Caractères",sentences:"Phrases",clean:"Nettoyer",removeDup:"Supprimer les doublons",upper:"MAJUSCULES",lower:"minuscules",copy:"Copier le résultat",copied:"Copié",result:"Résultat",file:"Choisir une image",quality:"Qualité",compress:"Compresser",download:"Télécharger l’image",qrInput:"Lien ou texte",makeQR:"Créer le QR",length:"Longueur",weight:"Poids",temperature:"Température",from:"De",to:"Vers",convert:"Convertir",value:"Valeur",selectFile:"Choisissez une image",noFile:"Aucune image sélectionnée",ready:"Terminé",invalid:"Entrez une valeur valide",qrError:"Bibliothèque QR indisponible. Vérifiez Internet."},
en:{tagline:"Smart digital workspace",eyebrow:"YOUR DIGITAL WORKSPACE",headline:"All your tools. One place.",intro:"Simple, fast tools for everyday tasks, right in your browser. With local tools, your files stay on your device.",counterTitle:"Word Counter",counterDesc:"Count words, characters and sentences.",cleanTitle:"Text Cleaner",cleanDesc:"Remove extra spaces and blank lines.",dupTitle:"Duplicate Remover",dupDesc:"Remove repeated lines from text.",formatTitle:"Text Formatter",formatDesc:"Convert text to upper or lower case.",imageTitle:"Image Compressor",imageDesc:"Compress JPG, PNG and WEBP images in your browser.",qrTitle:"QR Generator",qrDesc:"Turn a link or text into a QR code.",unitTitle:"Unit Converter",unitDesc:"Convert length, weight and temperature.",back:"Back to tools",text:"Text",paste:"Type or paste your text here...",count:"Count",words:"Words",chars:"Characters",sentences:"Sentences",clean:"Clean text",removeDup:"Remove duplicates",upper:"UPPERCASE",lower:"lowercase",copy:"Copy result",copied:"Copied",result:"Result",file:"Choose image",quality:"Image quality",compress:"Compress image",download:"Download image",qrInput:"Link or text",makeQR:"Generate QR",length:"Length",weight:"Weight",temperature:"Temperature",from:"From",to:"To",convert:"Convert",value:"Value",selectFile:"Choose an image",noFile:"No image selected",ready:"Done",invalid:"Enter a valid value",qrError:"QR library unavailable. Check your internet connection."}
};
let lang="ar",current="";
const $=s=>document.querySelector(s), t=k=>dict[lang][k]||k;
function setLanguage(v){lang=v;document.documentElement.lang=v;document.documentElement.dir=v==="ar"?"rtl":"ltr";["tagline","eyebrow","headline","intro","footer"].forEach(id=>$("#"+id).textContent=t(id));document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));if(current)openTool(current)}
$("#language").addEventListener("change",e=>setLanguage(e.target.value));
function shell(title,html){$("#worktitle").textContent=title;$("#workbody").innerHTML=html;$("#workspace").classList.add("active");$("#tools").style.display="none";$("#hero").style.display="none";$("#workspace").scrollIntoView({behavior:"smooth",block:"start"})}
function back(){current="";$("#workspace").classList.remove("active");$("#tools").style.display="grid";$("#hero").style.display="block"}
$("#back").onclick=back;$("#backtxt").textContent=t("back");
function textarea(){return `<label>${t("text")}</label><textarea id="source" placeholder="${t("paste")}"></textarea><div class="status" id="status"></div>`}
function openTool(id){current=id;let html="";
if(id==="counter"){shell(t("counterTitle"),textarea()+`<div class="actions"><button class="primary" id="do">${t("count")}</button></div><div class="stats"><div class="stat"><b id="words">0</b>${t("words")}</div><div class="stat"><b id="chars">0</b>${t("chars")}</div><div class="stat"><b id="sentences">0</b>${t("sentences")}</div></div>`);$("#do").onclick=()=>{let s=$("#source").value.trim();$("#words").textContent=s?(s.match(/\S+/g)||[]).length:0;$("#chars").textContent=$("#source").value.length;$("#sentences").textContent=s?(s.match(/[.!?؟۔]+/g)||[]).length:0};}
if(id==="cleaner"){shell(t("cleanTitle"),textarea()+`<div class="actions"><button class="primary" id="do">${t("clean")}</button><button class="secondary" id="copy">${t("copy")}</button></div><label>${t("result")}</label><textarea id="output" readonly></textarea>`);$("#do").onclick=()=>$("#output").value=$("#source").value.split(/\r?\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean).join("\n");bindCopy();}
if(id==="duplicates"){shell(t("dupTitle"),textarea()+`<div class="actions"><button class="primary" id="do">${t("removeDup")}</button><button class="secondary" id="copy">${t("copy")}</button></div><label>${t("result")}</label><textarea id="output" readonly></textarea>`);$("#do").onclick=()=>$("#output").value=[...new Set($("#source").value.split(/\r?\n/))].join("\n");bindCopy();}
if(id==="formatter"){shell(t("formatTitle"),textarea()+`<div class="actions"><button class="primary" id="upper">${t("upper")}</button><button class="secondary" id="lower">${t("lower")}</button><button class="secondary" id="copy">${t("copy")}</button></div><label>${t("result")}</label><textarea id="output" readonly></textarea>`);$("#upper").onclick=()=>$("#output").value=$("#source").value.toLocaleUpperCase();$("#lower").onclick=()=>$("#output").value=$("#source").value.toLocaleLowerCase();bindCopy();}
if(id==="image"){shell(t("imageTitle"),`<div class="drop"><p>${t("selectFile")}</p><input type="file" id="imgfile" accept="image/*"></div><label>${t("quality")}: <span id="qval">75%</span></label><input id="quality" type="range" min="10" max="95" value="75" style="width:100%"><div class="actions"><button class="primary" id="compress">${t("compress")}</button><a class="secondary" id="download" style="display:none;text-decoration:none">${t("download")}</a></div><div class="status" id="status">${t("noFile")}</div><div id="preview"></div>`);let blob=null;$("#quality").oninput=()=>$("#qval").textContent=$("#quality").value+"%";$("#compress").onclick=()=>{let f=$("#imgfile").files[0];if(!f){$("#status").textContent=t("noFile");return}let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{let c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);c.toBlob(b=>{blob=b;let u=URL.createObjectURL(b),a=$("#download");a.href=u;a.download="adel-compressed.jpg";a.style.display="inline-block";$("#preview").innerHTML=`<img alt="Compressed image" src="${u}" style="max-width:100%;max-height:300px;border-radius:12px;margin-top:15px">`;$("#status").textContent=`${(f.size/1024).toFixed(1)} KB → ${(b.size/1024).toFixed(1)} KB · ${t("ready")}`}, "image/jpeg",Number($("#quality").value)/100);URL.revokeObjectURL(url)};im.onerror=()=>$("#status").textContent=t("invalid");im.src=url};}
if(id==="qr"){shell(t("qrTitle"),`<label>${t("qrInput")}</label><input id="qrtext" type="text" placeholder="https://example.com"><div class="actions"><button class="primary" id="make">${t("makeQR")}</button></div><div id="qrout"></div><div class="status" id="status"></div>`);$("#make").onclick=()=>{let v=$("#qrtext").value.trim();$("#qrout").innerHTML="";if(!v)return;if(!window.QRCode){$("#status").textContent=t("qrError");return}new QRCode($("#qrout"),{text:v,width:220,height:220,colorDark:"#111827",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});};}
if(id==="units"){shell(t("unitTitle"),`<label>${t("value")}</label><input type="number" id="val" value="1"><div class="row"><div><label>${t("from")}</label><select id="from"><option value="m">m</option><option value="km">km</option><option value="cm">cm</option><option value="kg">kg</option><option value="g">g</option><option value="c">°C</option><option value="f">°F</option></select></div><div><label>${t("to")}</label><select id="to"><option value="km">km</option><option value="m">m</option><option value="cm">cm</option><option value="g">g</option><option value="kg">kg</option><option value="f">°F</option><option value="c">°C</option></select></div></div><div class="actions"><button class="primary" id="convert">${t("convert")}</button></div><div class="stats"><div class="stat"><b id="converted">—</b>${t("result")}</div></div>`);$("#convert").onclick=()=>{let n=Number($("#val").value),a=$("#from").value,b=$("#to").value,r=NaN;const groups={m:{m:1,km:.001,cm:100},km:{m:1000,km:1,cm:100000},cm:{m:.01,km:.00001,cm:1},kg:{kg:1,g:1000},g:{kg:.001,g:1}};if(groups[a]&&groups[a][b]!=null)r=n*groups[a][b];else if(a==="c"&&b==="f")r=n*9/5+32;else if(a==="f"&&b==="c")r=(n-32)*5/9;else if(a===b)r=n;$("#converted").textContent=Number.isFinite(r)?Number(r.toFixed(6)).toString():t("invalid")};}
}
function bindCopy(){let b=$("#copy");b.onclick=async()=>{try{await navigator.clipboard.writeText($("#output").value);$("#status").textContent=t("copied")}catch(e){$("#output").select();document.execCommand("copy");$("#status").textContent=t("copied")}}}
document.querySelectorAll(".tool").forEach(b=>b.addEventListener("click",()=>openTool(b.dataset.tool)));
setLanguage("ar");
</script>
</body>
</html>
